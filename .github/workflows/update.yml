name: Auto Update IPTV Playlist

on:
  schedule:
    # Berjalan otomatis setiap 6 jam
    - cron: '0 */6 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Jalankan Script Auto Update
        run: |
          python updater.py

      - name: Commit dan Push Otomatis ke Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update Playlist: $(date '+%Y-%m-%d %H:%M:%S')" && git push)
